name: Build check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Plugin manifests, marketplaces and skills
        run: scripts/validate-plugin.py

      - name: Commands are generated from skills
        run: scripts/build-commands.sh --check
